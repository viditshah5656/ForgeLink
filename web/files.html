<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ForgeLink · Files</title><link rel="stylesheet" href="assets/styles.css"></head>
<body data-page="files"><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><div class="main"><header class="topbar" id="topbar"></header><main class="content">
  <section class="page-head"><div><span class="kicker">Workspace browser</span><h1>All your projects.</h1><p>Safely browse the same <strong>C:\Coding</strong> tree available to ChatGPT. File previews here are always read-only.</p></div><span class="badge read" id="fileCount">Loading…</span></section>
  <div class="toolbar"><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="fileSearch" type="search" placeholder="Filter this folder…" autocomplete="off"></label><select class="select-control" id="rootPicker" aria-label="Allowed folder"></select></div>
  <div class="breadcrumb" id="breadcrumbs"></div>
  <section class="card file-panel"><table class="file-table"><thead><tr><th>Name</th><th>Size</th><th>Modified</th></tr></thead><tbody id="fileBody"></tbody></table></section>
</main></div></div>
<div class="drawer-backdrop" id="drawerBackdrop"></div><aside class="drawer" id="previewDrawer"><div class="drawer-head"><div class="drawer-title"><strong id="previewName">File preview</strong><span id="previewMeta"></span></div><button class="icon-button" id="copyPath" aria-label="Copy path"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg></button><button class="icon-button" id="closePreview" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><pre class="code-preview" id="previewContent"></pre></aside>
<div class="toast" id="toast"></div><script src="assets/app.js"></script></body></html>
